<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PWA Limpieza Hotel - Recepción</title>
    <link rel="manifest" href="/manifest.json" />
  <!-- Bootstrap for buttons and badges -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Recepción</h1>
      <nav>
        <a href="/index.html" style="color: antiquewhite;">Cerrar sesión</a>
      </nav>
    </header>
    <main class="container">
      <section class="card">
        <div class="card-header">
          <h2>Habitaciones</h2>
          <div class="controls">
            <button id="btnAddRoom" class="btn btn-primary">Nueva Habitación</button>
          </div>
        </div>
        <div id="roomsList" class="grid"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Camareras</h2>
          <div class="controls">
            <button id="btnAddMaid" class="btn btn-secondary">Nueva Camarera</button>
          </div>
        </div>
        <div id="maidsList"></div>
      </section>

      <section class="card">
        <h2>Historial de siniestros</h2>
        <div id="reportsList"></div>
      </section>
    </main>

    <!-- Modales simples -->
    <div id="modal" class="modal hidden"></div>

    <script type="module" src="/src/reception.js"></script>
  </body>
</html>
