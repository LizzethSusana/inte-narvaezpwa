<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PWA Limpieza Hotel - Login</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card login-card">
        <h1>Hotel Mongos</h1>
        <p>
          Ingresa como <strong>reception</strong> o con el correo/ID de la camarera
          (ej: <em>camarera@example.com</em>).
        </p>
        <form id="loginForm">
          <label for="username">Usuario</label>
          <input id="username" name="username" required autocomplete="off" />
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
          <div class="row">
            <button type="submit">Entrar</button>
          </div>
        </form>
    
      </section>
    </main>

    <script type="module" src="/src/app-login.js"></script>
  </body>
</html>
