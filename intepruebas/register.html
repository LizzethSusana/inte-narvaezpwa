<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PWA Limpieza Hotel - Registro</title>
    <link rel="manifest" href="./manifest.json" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="login-card">
        <h1>Hotel Mongo</h1>
        <p>Crea tu cuenta de usuario</p>

        <form id="registerForm">
          <label for="fullname">Nombre completo:</label>
          <input 
            id="fullname" 
            name="fullname" 
            type="text"
            required 
            autocomplete="name"
            placeholder="Ingresa tu nombre completo" 
          />

          <label for="username">Correo electrónico:</label>
          <input 
            id="username" 
            name="username" 
            type="email"
            required 
            autocomplete="email"
            placeholder="ejemplo@correo.com" 
          />

          <label for="password">Contraseña:</label>
          <div class="password-field">
            <input 
              id="password" 
              name="password" 
              type="password" 
              required 
              autocomplete="new-password"
              placeholder="Crea una contraseña segura"
            />
            <button type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña" class="toggle-password">
              <i class="bi bi-eye-slash" id="eyeIcon"></i>
            </button>
          </div>

          <label for="confirmPassword">Confirmar contraseña:</label>
          <div class="password-field">
            <input 
              id="confirmPassword" 
              name="confirmPassword" 
              type="password" 
              required 
              autocomplete="new-password"
              placeholder="Confirma tu contraseña"
            />
            <button type="button" id="toggleConfirmPassword" aria-label="Mostrar u ocultar contraseña" class="toggle-password">
              <i class="bi bi-eye-slash" id="eyeIconConfirm"></i>
            </button>
          </div>

          <label for="role">Rol:</label>
          <select id="role" name="role" required>
            <option value="">Selecciona un rol</option>
            <option value="1">Recepcionista</option>
            <option value="2">Camarera</option>
          </select>

          <div id="registerError" class="error-msg hidden"></div>
          <div id="registerSuccess" class="success-msg hidden"></div>

          <button type="submit">Registrarse</button>

          <div style="text-align: center; margin-top: 20px;">
            <a href="./index.html" style="color: var(--primary); text-decoration: none;">
              ¿Ya tienes cuenta? Inicia sesión aquí
            </a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="./src/app-register.js"></script>
  </body>
</html>
