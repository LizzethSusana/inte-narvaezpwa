<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>PWA Limpieza Hotel - Camarera</title>
    <link rel="manifest" href="./manifest.json" />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- QR Scanner -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="./src/styles/maid.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <i class="bi bi-person-circle"></i>
        <span id="userEmail" class="user-email">Cargando...</span>
      </div>
      <div class="header-right">
        <button id="scanQrBtn" class="icon-btn" title="Escanear QR">
          <i class="bi bi-qr-code-scan"></i>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
      <!-- FILTER BUTTON GROUP -->
      <div class="filter-group" id="filterGroup"></div>

      <!-- FLOOR CARDS -->
      <div class="floor-grid" id="floorGrid"></div>

      <!-- ROOMS SECTION -->
      <section class="rooms-section">
        <h2 class="section-title">Habitaciones</h2>
        <div id="roomsList" class="rooms-list"></div>
      </section>
    </main>

    <!-- MODAL -->
    <div id="modal" class="modal hidden"></div>

    <script type="module" src="./src/pages/maid.js"></script>
  </body>
</html>
