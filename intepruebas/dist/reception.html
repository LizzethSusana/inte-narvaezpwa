<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="description" content="Aplicación para gestión de limpieza de habitaciones de hotel" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LimpiezaHotel" />
    <title>PWA Limpieza Hotel - Recepción</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
  <script type="module" crossorigin src="/assets/reception-DTi5w9F9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/constants-BVeJQJW2.js">
  <link rel="modulepreload" crossorigin href="/assets/sw-register-DeILLKBX.js">
  <link rel="modulepreload" crossorigin href="/assets/idb-cleanup-DYMc0oMr.js">
  <link rel="stylesheet" crossorigin href="/assets/reception-PdqD0ghy.css">
</head>

<body>
    <!-- SIDEBAR (Desktop) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-nav">
            <button class="sidebar-item active" data-section="rooms" title="Habitaciones">
                <i class="bi bi-door-closed"></i>
                <span class="sidebar-label">Habitaciones</span>
            </button>
            <button class="sidebar-item" data-section="maids" title="Camareras">
                <i class="bi bi-people"></i>
                <span class="sidebar-label">Camareras</span>
            </button>
            <button class="sidebar-item" data-section="reports" title="Reportes">
                <i class="bi bi-file-earmark-text"></i>
                <span class="sidebar-label">Reportes</span>
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="sidebar-item" id="logoutBtn" title="Cerrar sesión">
                <i class="bi bi-box-arrow-right"></i>
                <span class="sidebar-label">Salir</span>
            </button>
        </div>
    </aside>

    <!-- MOBILE NAVBAR -->
    <nav class="mobile-navbar" id="mobileNavbar">
        <button class="hamburger-btn" id="hamburgerBtn">
            <i class="bi bi-list"></i>
        </button>
        <h1 class="mobile-title" id="mobileTitle">Habitaciones</h1>
        <button class="mobile-logout-btn" id="mobileLogoutBtn">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </nav>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-content">
            <button class="mobile-menu-item active" data-section="rooms">
                <i class="bi bi-door-closed"></i>
                <span>Habitaciones</span>
            </button>
            <button class="mobile-menu-item" data-section="maids">
                <i class="bi bi-people"></i>
                <span>Camareras</span>
            </button>
            <button class="mobile-menu-item" data-section="reports">
                <i class="bi bi-file-earmark-text"></i>
                <span>Reportes</span>
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <!-- HEADER -->
        <header class="content-header">
            <h1 class="section-title" id="sectionTitle">Habitaciones</h1>
            <button class="btn-create" id="btnCreate">
                <i class="bi bi-plus-circle"></i>
                <span>Nueva Habitación</span>
            </button>
        </header>

        <!-- ===================================
             SECCIÓN: HABITACIONES
        ==================================== -->
        <section class="section active" id="section-rooms">
            <!-- Floor Button Group -->
            <div class="floor-filters" id="floorFilters">
                <button class="floor-btn active" data-floor="all">Todos</button>
            </div>

            <!-- Search & Filters -->
            <div class="search-filters-bar">
                <div class="search-input-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchRooms" class="search-input" placeholder="Buscar habitación..." />
                </div>
                <select id="filterStatus" class="filter-select">
                    <option value="">Estado</option>
                    <option value="disponible">Limpia</option>
                    <option value="ocupada">Ocupada</option>
                    <option value="limpieza">Sucia</option>
                    <option value="mantenimiento">Bloqueada</option>
                </select>
                <select id="filterMaid" class="filter-select">
                    <option value="">Camarera</option>
                </select>
            </div>

            <!-- Layout Generator (Desktop Only) -->
            <div class="layout-generator">
                <div class="layout-inputs">
                    <input type="number" id="layoutFloors" placeholder="Pisos" min="1" />
                    <input type="number" id="layoutRooms" placeholder="Habitaciones" min="1" />
                    <button id="btnGenerateRooms" class="btn-secondary">
                        <i class="bi bi-grid-3x3"></i>
                        Generar
                    </button>
                </div>
                <small id="layoutStatus" class="layout-status"></small>
            </div>

            <!-- Table (Desktop) -->
            <div class="table-container desktop-only">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Estado</th>
                            <th>Camarera Asignada</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="roomsTableBody"></tbody>
                </table>
            </div>

            <!-- Cards (Mobile) -->
            <div class="cards-container mobile-only" id="roomsCards"></div>

            <!-- Pagination -->
            <div class="pagination" id="roomsPager"></div>
        </section>

        <!-- ===================================
             SECCIÓN: CAMARERAS
        ==================================== -->
        <section class="section" id="section-maids">
            <!-- Search & Filters -->
            <div class="search-filters-bar">
                <div class="search-input-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchMaids" class="search-input" placeholder="Buscar camarera..." />
                </div>
                <select id="filterMaidStatus" class="filter-select">
                    <option value="">Estado</option>
                    <option value="disponible">Disponible</option>
                    <option value="no disponible">No Disponible</option>
                </select>
            </div>

            <!-- Table (Desktop) -->
            <div class="table-container desktop-only">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="maidsTableBody"></tbody>
                </table>
            </div>

            <!-- Cards (Mobile) -->
            <div class="cards-container mobile-only" id="maidsCards"></div>

            <!-- Pagination -->
            <div class="pagination" id="maidsPager"></div>
        </section>

        <!-- ===================================
             SECCIÓN: REPORTES
        ==================================== -->
        <section class="section" id="section-reports">
            <!-- Search & Filters -->
            <div class="search-filters-bar">
                <div class="search-input-wrapper">
                    <i class="bi bi-search"></i>
                    <input type="text" id="searchReports" class="search-input" placeholder="Buscar reporte..." />
                </div>
                <select id="filterReportRoom" class="filter-select">
                    <option value="">Habitación</option>
                </select>
                <select id="filterReportMaid" class="filter-select">
                    <option value="">Camarera</option>
                </select>
                <select id="filterReportStatus" class="filter-select">
                    <option value="">Estado</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Habilitado">Resuelto</option>
                </select>
            </div>

            <!-- Table (Desktop) -->
            <div class="table-container desktop-only">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Habitación</th>
                            <th>Camarera</th>
                            <th>Tema</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody"></tbody>
                </table>
            </div>

            <!-- Cards (Mobile) -->
            <div class="cards-container mobile-only" id="reportsCards"></div>

            <!-- Pagination -->
            <div class="pagination" id="reportsPager"></div>
        </section>
    </main>

    <!-- MODAL GENERAL -->
    <div id="modal" class="modal hidden">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- MODAL VER IMÁGENES -->
    <div id="imgModal" class="modal hidden">
        <div class="modal-content img-viewer">
            <div class="img-controls">
                <button id="imgPrev" class="img-nav-btn">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <span id="imgCounter" class="img-counter"></span>
                <button id="imgNext" class="img-nav-btn">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <img id="modalImg" class="modal-img" src="" alt="Imagen del reporte" />
        </div>
    </div>

    <!-- Scripts -->

    <script>
    /* Modal para ver imágenes */
    window.openImagesModal = function (images) {
        if (!Array.isArray(images) || !images.length) return;
        window._imgGallery = images.slice();
        window._imgIndex = 0;
        const imgEl = document.getElementById('modalImg');
        const counter = document.getElementById('imgCounter');
        imgEl.src = window._imgGallery[0];
        counter.textContent = `1 / ${window._imgGallery.length}`;
        document.getElementById('imgModal').classList.remove('hidden');
    };

    document.getElementById('imgPrev').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!window._imgGallery) return;
        window._imgIndex = (window._imgIndex - 1 + window._imgGallery.length) % window._imgGallery.length;
        document.getElementById('modalImg').src = window._imgGallery[window._imgIndex];
        document.getElementById('imgCounter').textContent = `${window._imgIndex + 1} / ${window._imgGallery.length}`;
    });

    document.getElementById('imgNext').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!window._imgGallery) return;
        window._imgIndex = (window._imgIndex + 1) % window._imgGallery.length;
        document.getElementById('modalImg').src = window._imgGallery[window._imgIndex];
        document.getElementById('imgCounter').textContent = `${window._imgIndex + 1} / ${window._imgGallery.length}`;
    });

    document.getElementById('imgModal').addEventListener('click', (e) => {
        if (e.target.id === 'imgModal') {
            document.getElementById('imgModal').classList.add('hidden');
        }
    });
    </script>
</body>
</html>
